name = "finance-manager-cron"
main = "index.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "finance-db"
database_id = "588ecb08-91d4-4f93-9f65-990306bc48fa"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[triggers]
crons = [
  "0 17 * * 1",   # Weekly snapshot — Sunday 17:00 UTC = Monday 00:00 Vietnam
  "0 1 * * *",    # Daily maturity/interest reminder — 01:00 UTC = 08:00 Vietnam
]
